<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLA MQTT Monitor</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  *{box-sizing:border-box;font-family:Consolas,monospace}
  body{margin:0;background:#0f1115;color:#e6e6e6;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;background:#161a22;border-bottom:1px solid #2a2f3a;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h2{margin:0;font-size:18px}
  input,button{padding:8px 12px;border-radius:6px;border:1px solid #2a2f3a;background:#0f1115;color:#fff}
  button{cursor:pointer;background:#2d6cff;border:none;font-weight:bold}
  button.secondary{background:#2a2f3a}
  button.danger{background:#ff3b3b}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{font-size:13px;padding:4px 10px;border-radius:20px;background:#2a2f3a}
  #status.on{background:#0e3d1f;color:#4ade80}
  #status.off{background:#3d0e0e;color:#ff7a7a}

  /* CONTAINER JADI ATAS BAWAH */
 .container{display:flex;flex-direction:column;flex:1;overflow:hidden}

  /* ATAS - TOPIC CHIPS KESAMPING */
  #colTopics{padding:12px 14px;background:#161a22;border-bottom:1px solid #2a2f3a;flex:0 0 auto;max-height:35vh;overflow-y:auto}
  #colTopics h3{margin:0 0 10px 0;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#9aa4b2}
  #topicList{display:flex;flex-wrap:wrap;gap:8px}
 .topic-item{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:#0f1115;border:1px solid #232937;border-radius:20px}
 .topic-item label{font-size:12px;cursor:pointer;white-space:nowrap}
 .topic-item input{width:14px;height:14px}
 .topic-item:hover{border-color:#2d6cff}
 .cnt{font-size:11px;background:#232937;padding:1px 6px;border-radius:10px}

  /* BAWAH - LOG FULL */
  #colMessages{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 14px}
 .controls{display:flex;gap:8px;margin-bottom:10px;align-items:center}
 .controls h3{margin:0;flex:1;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#9aa4b2}
  #messages{flex:1;overflow-y:auto;font-size:13px;line-height:1.6;background:#0f1115;border:1px solid #1e232e;border-radius:6px;padding:6px}
 .msg{padding:2px 6px;border-bottom:1px solid #161a22;white-space:pre-wrap;word-break:break-all}
 .msg:hover{background:#161a22}
 .hint{font-size:12px;color:#7c8aa0;margin-top:8px}
</style>
</head>
<body>
<header>
  <h2>DLA Monitor</h2>
  <input id="brokerIp" placeholder="IP Gateway misal 10.155.xx.xx" style="min-width:220px">
  <button id="btnConnect">Connect</button>
  <button id="btnStop" class="secondary" disabled>Stop</button>
  <span id="status" class="off">DISCONNECTED</span>
  <span style="margin-left:auto;font-size:12px;color:#7c8aa0">user: dlauser | topic: dla/# | ws port: 15675</span>
</header>

<div class="container">
  <!-- ATAS -->
  <div id="colTopics">
    <h3>Topics (dla/) - <span id="topicCount">0</span></h3>
    <div id="topicList"></div>
    <div class="hint">Topic akan muncul otomatis</div>
  </div>

  <!-- BAWAH FULL -->
  <div id="colMessages">
    <div class="controls">
      <h3>Messages - <span id="msgCount">0</span> | format: hh:mm:ss,topic,payload</h3>
      <button id="btnClear" class="danger">Clear</button>
    </div>
    <div id="messages"></div>
  </div>
</div>

<script>
const brokerIpInput = document.getElementById('brokerIp');
const btnConnect = document.getElementById('btnConnect');
const btnStop = document.getElementById('btnStop');
const btnClear = document.getElementById('btnClear');
const statusEl = document.getElementById('status');
const topicListEl = document.getElementById('topicList');
const messagesEl = document.getElementById('messages');
const topicCountEl = document.getElementById('topicCount');
const msgCountEl = document.getElementById('msgCount');

let client = null;
let discoveredTopics = new Map();
let msgCounter = 0;
let isPaused = false;

function getBrokerUrl(){
  let raw = brokerIpInput.value.trim();
  if(!raw) return null;
  if(raw.includes('://')) return raw;
  let ip = raw, port = 15675, path = '/ws';
  if(raw.includes(':')){
    const parts = raw.split(':');
    ip = parts[0];
    const p = parseInt(parts[1]);
    if(!isNaN(p)) port = p;
  }
  return `ws://${ip}:${port}${path}`;
}
function setStatus(on, text){ statusEl.textContent = text; statusEl.className = on? 'on' : 'off'; }

function renderTopics(){
  topicListEl.innerHTML = '';
  const sorted = Array.from(discoveredTopics.keys()).sort();
  sorted.forEach(topic=>{
    const data = discoveredTopics.get(topic);
    const safeId = btoa(topic).replace(/=/g,'');
    const div = document.createElement('div');
    div.className = 'topic-item';
    div.innerHTML = `<input type="checkbox" id="chk-${safeId}" ${data.enabled?'checked':''}><label for="chk-${safeId}">${topic}</label><span class="cnt">${data.count}</span>`;
    div.querySelector('input').addEventListener('change', (e)=>{
      discoveredTopics.get(topic).enabled = e.target.checked;
    });
    topicListEl.appendChild(div);
  });
  topicCountEl.textContent = discoveredTopics.size;
}
function addOrUpdateTopic(topic){
  if(!discoveredTopics.has(topic)){
    discoveredTopics.set(topic, {enabled:true, count:0});
  }
  discoveredTopics.get(topic).count++;
  renderTopics();
}
function addMessage(topic, payload){
  if(isPaused) return;
  const t = discoveredTopics.get(topic);
  if(t &&!t.enabled) return;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('id-ID', {hour12:false}) + '.' + String(now.getMilliseconds()).padStart(3,'0');

  const line = `${timeStr},${topic},${payload}`;

  const row = document.createElement('div');
  row.className = 'msg';
  row.textContent = line; // pakai textContent biar aman
  messagesEl.prepend(row);
  msgCounter++; msgCountEl.textContent = msgCounter;
  if(messagesEl.children.length > 1000) messagesEl.removeChild(messagesEl.lastChild);
}
btnConnect.addEventListener('click', ()=>{
  const url = getBrokerUrl();
  if(!url){ alert('Isi IP Gateway, Contoh: 10.155.170.xxx'); return; }
  localStorage.setItem('dla_broker_ip', brokerIpInput.value.trim());
  if(client) { try{client.end(true)}catch(e){} }
  setStatus(false, 'CONNECTING '+url);
  btnConnect.disabled = true;
  const options = { username: 'dlauser', password: 'P4m@2023', clean: true, connectTimeout: 5000, reconnectPeriod: 0 };
  client = mqtt.connect(url, options);
  client.on('connect', ()=>{
    setStatus(true, 'CONNECTED '+url);
    btnStop.disabled = false; btnConnect.disabled = true; isPaused = false; btnStop.textContent = 'Stop';
    client.subscribe('dla/#', (err)=>{ if(err){ alert('Subscribe error: '+err.message); } else { addMessage('SYSTEM', 'Subscribed to dla/#'); } });
  });
  client.on('message', (topic, message)=>{ const payload = message.toString(); addOrUpdateTopic(topic); addMessage(topic, payload); });
  client.on('error', (err)=>{ setStatus(false, 'ERROR: '+err.message); btnConnect.disabled = false; btnStop.disabled = true; });
  client.on('close', ()=>{ if(statusEl.textContent.startsWith('CONNECTED')){ setStatus(false, 'DISCONNECTED'); btnConnect.disabled = false; btnStop.disabled = true; } });
});
btnStop.addEventListener('click', ()=>{
  if(!client) return;
  if(!isPaused){ isPaused = true; btnStop.textContent = 'Resume'; setStatus(false, 'PAUSED'); }
  else { isPaused = false; btnStop.textContent = 'Stop'; setStatus(true, 'CONNECTED (RESUMED)'); }
});
btnClear.addEventListener('click', ()=>{ messagesEl.innerHTML = ''; msgCounter = 0; msgCountEl.textContent = '0'; });
const lastIp = localStorage.getItem('dla_broker_ip'); if(lastIp) brokerIpInput.value = lastIp;
</script>
</body>
</html>
