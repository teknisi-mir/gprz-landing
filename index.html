<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPRZ - Tracking Ideas To Stuff</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #333; text-align: center; }
  .header { padding: 60px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
  .header h1 { font-size: 48px; margin: 0; }
  .game-container { padding: 40px 20px; background: #f7f7f7; }
  #game { background: white; border: 2px solid #ddd; border-radius: 8px; display: block; margin: 20px auto; max-width: 90%; }
  .info { color: #777; font-size: 14px; }
  .scores { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
</style>
</head>
<body>

  <div class="header">
    <h1>GPRZ</h1>
    <p>Tracking Ideas To Stuff</p>
  </div>

  <div class="game-container">
    <h2>Main Dino Dulu Sambil Cari Inspirasi 🦖</h2>
    <canvas id="game" width="800" height="250"></canvas>
    <div class="scores">
      <p><b>Score: <span id="score">0</span></b></p>
      <p><b>Highscore: <span id="highscore">0</span></b></p>
    </div>
    <p class="info">Tekan SPACE / Klik / Tap untuk Lompat</p>
  </div>

<audio id="jumpSound" src="swing.wav" preload="auto"></audio>
<audio id="hitSound" src="brak.wav" preload="auto"></audio>
  
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const jumpSound = document.getElementById("jumpSound");
const hitSound = document.getElementById("hitSound");

let dino = {x: 50, y: 200, w: 44, h: 47, dy: 0, jumping: false, color: "#667eea"}; // SKIN GPRZ UNGU
let gravity = 1.2;
let obstacles = [];
let clouds = [];
let groundX = 0;
let score = 0;
let highscore = localStorage.getItem("gprzHighscore") || 0;
let speed = 6;
let gameOver = false;
let frame = 0;

document.getElementById("highscore").innerText = highscore;

for(let i=0; i<3; i++) clouds.push({x: Math.random()*800, y: 30+Math.random()*50});

function jump() {
  if(!dino.jumping && !gameOver){
    dino.jumping = true;
    dino.dy = -22;
    jumpSound.currentTime = 0;
    jumpSound.play();
  } else if(gameOver){
    location.reload();
  }
}
document.addEventListener("keydown", e => { if(e.code === "Space") jump(); });
document.addEventListener("click", jump);
document.addEventListener("touchstart", jump);

function drawDino() {
  ctx.fillStyle = dino.color; // SKIN UNGU GPRZ
  ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
  ctx.fillRect(dino.x + 30, dino.y - 10, 20, 20); // kepala
}

function drawGround() {
  ctx.strokeStyle = "#535353";
  ctx.beginPath();
  ctx.moveTo(0, 247);
  ctx.lineTo(800, 247);
  ctx.stroke();
  groundX -= speed;
  if(groundX < -20) groundX = 0;
  for(let i=0; i<40; i++){
    ctx.fillRect(i*20 + groundX, 245, 10, 2);
  }
}

function update() {
  ctx.clearRect(0,0,800,250);
  
  clouds.forEach(c => {
    ctx.fillStyle = "#ddd";
    ctx.fillRect(c.x, c.y, 40, 15);
    c.x -= 1;
    if(c.x < -50) c.x = 850;
  });

  drawGround();
  
  dino.dy += gravity;
  dino.y += dino.dy;
  if(dino.y > 200){ dino.y = 200; dino.jumping = false; }
  drawDino();

  if(frame % 90 === 0){
    obstacles.push({x: 800, y: 210, w: 25, h: 40});
  }
  
  obstacles.forEach((obs, i) => {
    obs.x -= speed;
    ctx.fillStyle = "#535353";
    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
    
    if(obs.x < dino.x + dino.w && obs.x + obs.w > dino.x &&
       obs.y < dino.y + dino.h && obs.y + obs.h > dino.y){
      gameOver = true;
      hitSound.play();
      if(score > highscore){
        highscore = score;
        localStorage.setItem("gprzHighscore", highscore);
      }
    }
    if(obs.x < -30) { obstacles.splice(i,1); score++; document.getElementById("score").innerText = score; if(score%5===0) speed+=0.5; }
  });

  if(gameOver){
    ctx.fillStyle = "#535353";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 300, 120);
    ctx.font = "16px Arial";
    ctx.fillText("Klik untuk Restart", 310, 150);
  } else {
    frame++;
    requestAnimationFrame(update);
  }
}
update();
</script>

</body>
</html>
